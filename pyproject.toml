[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xdna-top"
version = "0.1.0"
description = "Unified NPU+iGPU Telemetry Monitor for AMD Strix Halo"
readme = "README.md"
authors = [
    { name = "Keith" }
]
license = { text = "Apache-2.0" }
urls = { Repository = "https://github.com/boxwrench/xdna-top" }
requires-python = ">=3.11"
dependencies = [
    "rich",
]

[project.optional-dependencies]
# Dev-only tooling for regenerating docs/themes/gallery.png. Not needed to run
# xdna-top. See docs/themes/render_gallery.py.
docs = [
    "cairosvg",
    "pillow",
]

[project.scripts]
xdna-top = "xdna_top.main:main"
lemonade-top = "xdna_top.lemonade:main"

[tool.setuptools.packages.find]
where = ["src"]
